version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node version CI runs (node-version: 24 in ci.yml). Raise
      # them together with that version, not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    exclude-paths:
      # Generated by aiG8way from the organisation's template; updates come from there.
      - .github/workflows/aig8way-verify.yml
