name: exchange-rates
# Keeps the exchange-rate table (src/data/exchangeRates.ts) current, as ADR 0016 requires: once a
# week it regenerates the table from the ECB's daily reference rates and opens, or updates, a
# pull request with the change. A person reviews and merges it like any other change.

on:
  schedule:
    # Mondays 05:30 UTC, after the ECB has published the previous week's rates
    - cron: '30 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exchange-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open the pull request
      actions: write # start CI on it (see below)
    env:
      BRANCH: chore/exchange-rates
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The script has no dependencies, so no npm ci. It stops on anything unexpected from the ECB.
      - run: node scripts/exchange-rates.ts

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- src/data/exchangeRates.ts; then
            echo "The table is already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          last=$(grep -oE '^    \["[0-9]{4}-[0-9]{2}-[0-9]{2}"' src/data/exchangeRates.ts | tail -1 | grep -oE '[0-9-]{10}')
          title="Update the exchange rates to $last"

          # The branch is rebuilt from main on every run, so it only ever holds this one commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add src/data/exchangeRates.ts
          git commit -m "$title"
          git push --force origin "$BRANCH"

          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          body="Generated by the exchange-rates workflow from the ECB's daily reference rates (ADR 0016). Check that the new days look reasonable, then merge."
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title"
          elif ! gh pr create --base main --head "$BRANCH" --title "$title" --body "$body"; then
            echo "::warning::Couldn't open a pull request. Allow GitHub Actions to create pull requests (Settings → Actions → General), or open one from $BRANCH by hand."
            echo "Pushed **$BRANCH**; open a pull request from it to main: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

          # A push or pull request made with the workflow's own token starts no other workflows,
          # so the required checks wouldn't run. A dispatch is the exception: start CI on the branch.
          gh workflow run ci.yml --ref "$BRANCH"
