name: aiG8way verify
# Generated by aiG8way. Checks the repository against the organisation's rules
# recorded in .aig8way/checks.json on every pull request. Nothing here needs a
# token beyond the default one, and nothing here calls out of GitHub.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the repository against the rules
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path')
          const { checks } = JSON.parse(fs.readFileSync('.aig8way/checks.json', 'utf8'))
          const files = []
          const walk = (d) => { for (const e of fs.readdirSync(d, { withFileTypes: true })) { if (e.name === '.git' || e.name === 'node_modules') continue; const p = path.join(d, e.name); e.isDirectory() ? walk(p) : files.push(path.relative('.', p)) } }
          walk('.')
          const esc = (s) => s.replace(/[.+^$\{}()|[\]\\]/g, '\\$&')
          const matcher = (spec) => {
            if (spec.endsWith('/')) return (p) => p.startsWith(spec)
            if (!spec.includes('*')) return (p) => p === spec
            const re = new RegExp('^' + esc(spec).replace(/\*\*\//g, '\u0001').replace(/\*\*/g, '\u0002').replace(/\*/g, '[^/]*').replace(/\u0001/g, '(?:.*/)?').replace(/\u0002/g, '.*') + '$')
            const bare = !spec.includes('/')
            return (p) => re.test(p) || (bare && re.test(path.basename(p)))
          }
          let failed = 0
          for (const c of checks) {
            let ok = false, why = ''
            if (c.kind === 'file-exists') {
              const hit = c.anyOf.map((s) => files.find(matcher(s))).find(Boolean)
              ok = Boolean(hit); why = ok ? hit + ' is present' : 'none of ' + c.anyOf.join(', ') + ' is present'
            } else {
              const targets = files.filter(matcher(c.path))
              const re = new RegExp(c.pattern, 'im'), not = c.notPattern ? new RegExp(c.notPattern, 'im') : null
              for (const t of targets) {
                const text = fs.readFileSync(t, 'utf8')
                if (re.test(text)) { if (not && not.test(text)) { why = t + ' still carries the placeholder text'; break } ok = true; why = t + ' carries the expected content'; break }
              }
              if (!ok && !why) why = targets.length ? targets.length + ' file(s) matching ' + c.path + ' lack the expected content' : 'no file matches ' + c.path
            }
            console.log((ok ? '  ok   ' : '  FAIL ') + c.control + ' — ' + why + (ok || !c.fix ? '' : '\n         fix: ' + c.fix))
            if (!ok) failed++
          }
          console.log(failed ? failed + ' check(s) failed' : 'all checks passed')
          process.exit(failed ? 1 : 0)
          EOF
