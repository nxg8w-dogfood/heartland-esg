name: deploy
# Publishes the code app to a Power Platform environment with the Power Apps CLI.
# dev deploys on every push to main; test and prod only when started by hand.
# Setup per environment is in docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [dev, test, prod]
        required: true
      commit:
        description: Commit to deploy (SHA on main). Leave empty for the latest main. Use the SHA deployed to test when deploying to prod.
        type: string
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}
    concurrency:
      group: deploy-${{ inputs.environment || 'dev' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.environment || 'dev' }}
    steps:
      # Only reviewed code: a manual run from any other branch fails.
      - name: Refuse runs from branches other than main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run only from main. This run was started from $GITHUB_REF_NAME, so nothing was deployed."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Deploy exactly the commit asked for, and only if it's on main.
      - name: Pick the commit to deploy
        id: commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -z "$COMMIT" ]; then
            sha=$(git rev-parse HEAD)
          else
            if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{7,40}$'; then
              echo "::error::'$COMMIT' isn't a commit SHA."
              exit 1
            fi
            if ! sha=$(git rev-parse --verify --quiet "$COMMIT^{commit}"); then
              echo "::error::Commit $COMMIT wasn't found."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" origin/main; then
              echo "::error::Commit $sha isn't on main, so it hasn't been reviewed. Nothing was deployed."
              exit 1
            fi
            git checkout --quiet --detach "$sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying \`$sha\` to $TARGET"

      - name: Check the environment is set up
        id: setup
        env:
          CLIENT_ID: ${{ vars.PA_CLI_SP_CLIENT_ID }}
          TENANT_ID: ${{ vars.PA_CLI_SP_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.PA_CLI_SP_CLIENT_SECRET }}
        run: |
          if [ ! -f "deploy/$TARGET/power.config.json" ]; then
            echo "::warning::$TARGET isn't set up yet (no deploy/$TARGET/power.config.json), so nothing was deployed. See docs/deploy.md."
          echo "Nothing deployed: **$TARGET** isn't set up yet. See \`docs/deploy.md\`." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          [ -n "$CLIENT_ID" ] || missing="$missing PA_CLI_SP_CLIENT_ID (variable)"
          [ -n "$TENANT_ID" ] || missing="$missing PA_CLI_SP_TENANT_ID (variable)"
          [ -n "$CLIENT_SECRET" ] || missing="$missing PA_CLI_SP_CLIENT_SECRET (secret)"
          if [ -n "$missing" ]; then
            echo "::error::The $TARGET GitHub environment is missing:$missing"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - if: steps.setup.outputs.ready == 'true'
        run: npm ci

      # Deploy only what passes the same checks as CI.
      - if: steps.setup.outputs.ready == 'true'
        run: |
          npm run lint
          npm test
          npm run build

      - if: steps.setup.outputs.ready == 'true'
        name: Publish to ${{ env.TARGET }}
        env:
          PA_CLI_USE_SP_AUTH: 'true'
          PA_CLI_SP_CLIENT_ID: ${{ vars.PA_CLI_SP_CLIENT_ID }}
          PA_CLI_SP_TENANT_ID: ${{ vars.PA_CLI_SP_TENANT_ID }}
          PA_CLI_SP_CLIENT_SECRET: ${{ secrets.PA_CLI_SP_CLIENT_SECRET }}
          SOLUTION_ID: ${{ vars.PA_CLI_SOLUTION_ID }}
          PA_CLI_TELEMETRY: 'off'
        run: |
          # Optional: without it, the CLI keeps the app's existing solution.
          if [ -n "$SOLUTION_ID" ]; then export PA_CLI_SOLUTION_ID="$SOLUTION_ID"; fi
          cp "deploy/$TARGET/power.config.json" power.config.json
          npx pa app push --non-interactive
          echo "Deployed \`${{ steps.commit.outputs.sha }}\` to **$TARGET**." >> "$GITHUB_STEP_SUMMARY"
